[package]
name = "bdip"
version = "0.1.1"
edition = "2024"
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "High-performance desktop GUI application using bdip-core."

[dependencies]
bdip-core = { path = "../bdip-core", version = "0.1.1" }
anyhow = "1"
clap = { version = "4.6.0", features = ["derive"] }
iced = { version = "0.14.0", features = ["image"] }
rfd = "0.15"

[package.metadata.bundle]
name = "bdip"
identifier = "com.billdirks.bdip"
icon = ["assets/goat.icns"]
version = "0.1.1"
copyright = "Copyright (c) 2026, William Dirks"
