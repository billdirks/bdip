[alias]

# Start the UI prototype Spike (Debug mode)
ui = "run -p bdip"

# Start the UI prototype Spike (Release mode for accurate performance/latency testing)
ui-release = "run -p bdip --release"

# Run headless CLI processing (e.g., cargo headless img.jpg --output out.png --apply brightness:0.5)
headless = "run -p bdip -- --headless"

# Run headless release CLI processing (e.g., cargo headless img.jpg --output out.png --apply brightness:0.5)
headless-release = "run -p bdip --release -- --headless"

# Run the 24 MP GPU roundtrip performance benchmark (ignored by default).
# Reports cold-start timings for upload, execute, and readback stages.
# Run in release mode for results comparable to the perf_goal_1.md targets.
perf-test = "test -p bdip_core --release -- --ignored test_perf_gpu_roundtrip_24mp --nocapture"

# Run rigorous static analysis (as required by .cursorrules)
lint = "clippy --workspace --all-targets --all-features"

# Format all code securely (as required by .cursorrules)
format = "fmt --all"
